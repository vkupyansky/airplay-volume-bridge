name: Проверки

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Зависимости
        run: brew install autoconf automake pkgconf libconfig popt openssl@3 ffmpeg python@3.15 uv gitleaks
      - name: Сборка и проверки
        run: make check
      - name: Проверка истории на секреты
        run: gitleaks git --redact --no-banner --ignore-gitleaks-allow --log-opts=--all .
