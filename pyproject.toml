[project]
name = "airplay-volume-bridge"
version = "0.1.0"
description = "Управление системной громкостью Mac через AirPlay"
requires-python = ">=3.15"
dependencies = []

[dependency-groups]
dev = ["mypy==2.4.1", "ruff==0.17.4"]

[tool.uv]
package = false

[tool.mypy]
strict = true
python_version = "3.15"
files = ["scripts", "tests"]
explicit_package_bases = true
